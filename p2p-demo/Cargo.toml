[package]
name = "meshline-p2p-demo"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Bounded text-only Meshline libp2p transport proof. Not production messaging."

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
libp2p = { version = "0.56", features = ["dcutr", "gossipsub", "identify", "macros", "mdns", "noise", "ping", "quic", "relay", "tcp", "tokio", "yamux"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
